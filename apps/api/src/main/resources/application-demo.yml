# Demo profile: boots without Postgres. Uses in-memory project/patch stores.
# Usage from repo root:
#   mvn -pl apps/api -am spring-boot:run -Dspring-boot.run.profiles=demo
#   java -jar apps/api/target/*.jar --spring.profiles.active=demo

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.shadowstack: INFO
    org.hibernate: WARN
    org.flywaydb: WARN
    org.springframework.jdbc: WARN

shadowstack:
  demo:
    enabled: true
    sample-path: ${SHADOWSTACK_DEMO_SAMPLE:examples/legacy-sample}
  security:
    jwt-secret: ${JWT_SECRET:demo-only-shadowstack-jwt-secret-key-min-32-chars-do-not-use-in-prod}
    jwt-expiration-ms: 86400000
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
