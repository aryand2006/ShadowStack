# Production profile — durable Postgres + real credentials required.
# Requires: JWT_SECRET, SECURITY_USER, SECURITY_PASSWORD, DB_*

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shadowstack}
    username: ${DB_USERNAME:${DB_USER:shadowstack}}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

shadowstack:
  demo:
    enabled: false
  # Worker owns VERIFY dequeue in production; set true for API-only / single-process.
  jobs:
    poller-enabled: ${SHADOWSTACK_JOBS_POLLER_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    encryption-key-base64: ${ENCRYPTION_KEY_BASE64:}

logging:
  level:
    root: INFO
    com.shadowstack: INFO
    org.hibernate.SQL: WARN
