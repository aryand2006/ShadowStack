name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install LibCST
        run: pip install -r packages/language-adapters/native-engines/python/requirements.txt

      - name: Set up .NET 8 (optional C# gate)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install GnuCOBOL (optional COBOL gate)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol || sudo apt-get install -y -qq gnucobol3 || true
          cobc --version || echo "cobc unavailable — COBOL cobc tests may soft-skip"

      # Reactor build so SNAPSHOT module deps (language-adapters → refactor-engine → api) resolve.
      - name: Test reactor modules
        run: >
          mvn -B -pl
          packages/language-adapters,packages/refactor-engine,packages/verify-engine,apps/api
          -am test

  # SOC 2 CC9.3 control readiness — filesystem vulnerability scan (HIGH/CRITICAL).
  # Fails the job on HIGH/CRITICAL findings. Not a substitute for a certified audit.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # Fail-closed on backend/Java deps. apps/web (Next.js) tracked via npm audit / Next advisories.
          skip-dirs: node_modules,.git,target,apps/web,packages/language-adapters/native-engines/js/node_modules,packages/language-adapters/native-engines/csharp/publish
