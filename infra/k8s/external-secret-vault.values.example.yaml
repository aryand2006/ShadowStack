# ═══════════════════════════════════════════════════════════════════
#  Example values for External Secrets → Vault SecretStore
#
#  Copy / substitute into external-secret-vault.yaml before apply.
#  Do NOT commit real URLs/roles with production credentials.
#
#  Usage:
#    export VAULT_ADDR=https://vault.prod.example.com:8200
#    export VAULT_K8S_ROLE=shadowstack
#    envsubst < infra/k8s/external-secret-vault.values.example.yaml
#  Or manually edit the SecretStore fields in external-secret-vault.yaml.
# ═══════════════════════════════════════════════════════════════════

# --- SecretStore (provider.vault) ---
vault:
  # REPLACE — HTTPS URL reachable from the ESO controller / cluster
  server: "https://vault.example.com:8200"
  # KV Secrets Engine v2 mount
  path: "secret"
  version: "v2"
  auth:
    kubernetesAuth:
      # Vault auth method mount
      path: "kubernetes"
      # Role bound to namespace shadowstack + ServiceAccount
      role: "shadowstack"
      serviceAccountRef:
        name: default
        # Prefer a dedicated SA in production, e.g.:
        # name: shadowstack-eso

# --- ExternalSecret mapping (already in external-secret-vault.yaml) ---
externalSecret:
  name: shadowstack-secrets-from-vault
  refreshInterval: 1h
  targetSecret: shadowstack-secrets
  # KV v2 logical path without mount + /data  →  remoteRef.key
  remoteKey: shadowstack/api
  properties:
    - JWT_SECRET
    - SECURITY_USER
    - SECURITY_PASSWORD
    - DB_USER
    - DB_PASSWORD
    - ENCRYPTION_KEY_BASE64   # optional in Vault; omit property if unused

# --- Suggested Vault KV payload (secret/data/shadowstack/api) ---
# JWT_SECRET:            "<openssl rand -base64 48>"
# SECURITY_USER:         "<admin>"
# SECURITY_PASSWORD:     "<≥12 chars>"
# DB_USER:               "shadowstack"
# DB_PASSWORD:           "<strong>"
# ENCRYPTION_KEY_BASE64: "<openssl rand -base64 32>"
