# ═══════════════════════════════════════════════════════════════════
#  ShadowStack Secrets — Template with placeholder values
#  ⚠️  NEVER commit real credentials. Replace placeholders before
#     applying. Prefer External Secrets Operator + Vault in production
#     (see external-secret-vault.yaml).
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: shadowstack-secrets
  namespace: shadowstack
  labels:
    app.kubernetes.io/name: secrets
    app.kubernetes.io/part-of: shadowstack
type: Opaque
# Prefer stringData for readability during bootstrap; switch to data (base64)
# once values are generated. Empty base64 ("") means unset — replace before apply.
stringData:
  # Database credentials — REPLACE BEFORE APPLYING
  DB_USER: "shadowstack"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Auth — REPLACE_ME with strong values (JWT ≥ 32 chars; no placeholder substrings)
  # JWT_SECRET: REPLACE_ME — e.g. openssl rand -base64 48
  JWT_SECRET: "REPLACE_ME"
  # SECURITY_USER / SECURITY_PASSWORD: REPLACE_ME (password length ≥ 12)
  SECURITY_USER: "REPLACE_ME"
  SECURITY_PASSWORD: "REPLACE_ME"

  # Optional AES-256 app encryption for patch artifacts (Base64 of 32 bytes)
  # openssl rand -base64 32
  # ENCRYPTION_KEY_BASE64: "REPLACE_ME"

# Equivalent opaque data keys (empty placeholders — populate with real base64):
# data:
#   JWT_SECRET: ""          # echo -n 'your-secret' | base64 -w0
#   SECURITY_USER: ""
#   SECURITY_PASSWORD: ""
#   ENCRYPTION_KEY_BASE64: ""
