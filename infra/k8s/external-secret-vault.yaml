# ═══════════════════════════════════════════════════════════════════
#  External Secrets → HashiCorp Vault (DOCUMENTATION-GRADE TEMPLATE)
#
#  This manifest is NOT applied by default. It documents how to sync
#  ShadowStack API secrets from Vault into the Kubernetes Secret
#  consumed by api-deployment.yaml / worker-deployment.yaml.
#
#  Prerequisites:
#    1. External Secrets Operator installed in the cluster
#       https://external-secrets.io/
#    2. Vault KV v2 secret at path: shadowstack/data/api
#       (mount "secret" → full path secret/data/shadowstack/api)
#    3. Vault auth (Kubernetes auth recommended) + policy allowing
#       read on secret/data/shadowstack/api
#
#  Example Vault KV payload (secret/shadowstack/api):
#    JWT_SECRET:            "<strong random ≥32 chars>"
#    SECURITY_USER:         "<admin username>"
#    SECURITY_PASSWORD:     "<admin password ≥12 chars>"
#    DB_USER:               "shadowstack"
#    DB_PASSWORD:           "<db password>"
#    ENCRYPTION_KEY_BASE64: "<openssl rand -base64 32>"   # optional
#
#  Rotation:
#    Update the Vault secret → ESO refreshes the K8s Secret on
#    refreshInterval → restart API/worker pods (or rely on reload
#    sidecars) so JVMs pick up new env values. Rotate JWT and
#    ENCRYPTION_KEY_BASE64 carefully — see docs/secrets-and-encryption.md.
#
#  Example values (server/role/path): external-secret-vault.values.example.yaml
#  Alternative: Vault Agent Injector — vault-agent-annotations.md
# ═══════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: shadowstack
  labels:
    app.kubernetes.io/name: vault-backend
    app.kubernetes.io/part-of: shadowstack
spec:
  provider:
    vault:
      # REPLACE: Vault server URL reachable from the cluster
      # See external-secret-vault.values.example.yaml
      server: "https://vault.example.com:8200"
      # KV Secrets Engine v2 mount path
      path: "secret"
      version: "v2"
      auth:
        kubernetesAuth:
          # REPLACE: Vault Kubernetes auth mount path
          path: "kubernetes"
          # REPLACE: Vault role bound to this namespace/SA
          role: "shadowstack"
          serviceAccountRef:
            name: default
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shadowstack-secrets-from-vault
  namespace: shadowstack
  labels:
    app.kubernetes.io/name: external-secret
    app.kubernetes.io/part-of: shadowstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    # Must match secretKeyRef.name in api-deployment / worker-deployment
    name: shadowstack-secrets
    creationPolicy: Owner
  data:
    # Vault path: shadowstack/data/api  (KV v2 → remoteRef.key = shadowstack/api)
    - secretKey: JWT_SECRET
      remoteRef:
        key: shadowstack/api
        property: JWT_SECRET
    - secretKey: SECURITY_USER
      remoteRef:
        key: shadowstack/api
        property: SECURITY_USER
    - secretKey: SECURITY_PASSWORD
      remoteRef:
        key: shadowstack/api
        property: SECURITY_PASSWORD
    - secretKey: DB_USER
      remoteRef:
        key: shadowstack/api
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: shadowstack/api
        property: DB_PASSWORD
    - secretKey: ENCRYPTION_KEY_BASE64
      remoteRef:
        key: shadowstack/api
        property: ENCRYPTION_KEY_BASE64
